[package]
name = "peek-desktop"
version = "0.1.0"
description = "A desktop network inspector compatible with Peek"
edition = "2024"
rust-version = "1.91"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peek_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
futures-util = { version = "0.3.34", features = ["sink"] }
httparse = "1.10.1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
local-ip-address = "0.6.13"
mdns-sd = "0.21.7"
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
sha2 = "0.11.1"
subtle = "2.6.1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.8.4"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.8"
uuid = { version = "1.29.2", features = ["v4"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
