name: 桌面检查与打包
on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'assets/**', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'third-party/**', '.github/**']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'assets/**', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'third-party/**', '.github/**']
  workflow_dispatch:
    inputs:
      create_draft:
        description: 全部平台通过后创建 Release 草稿
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 检查版本与发布标签
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            pnpm release:check "$GITHUB_REF_NAME"
          else
            pnpm release:check
          fi
      - run: pnpm release:test
      - run: pnpm check
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build
  package:
    needs: checks
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_MODE: unsigned
      UPDATER_SIGNING: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_draft) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 准备桌面更新签名配置
        if: env.UPDATER_SIGNING == 'true'
        env:
          PEEK_DESKTOP_UPDATER: ${{ secrets.PEEK_DESKTOP_UPDATER }}
        run: node scripts/prepare-updater.mjs
      - name: 构建并验证安装包
        shell: bash
        run: |
          args=("$PACKAGE_MODE" --target '${{ matrix.target }}')
          if [ "$UPDATER_SIGNING" = "true" ]; then
            args+=(--updater)
          fi
          node scripts/package-desktop.mjs "${args[@]}"
      - name: macOS 挂载、复制和验签
        if: runner.os == 'macOS'
        run: python3 scripts/verify-macos-package.py release-artifacts/*.dmg
      - name: Windows 安装、关联和卸载验证
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/windows-installer-test.ps1
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: peek-${{ matrix.target }}-${{ env.PACKAGE_MODE }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_draft)
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_MODE: unsigned
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: peek-*-unsigned
          path: release-artifacts
          merge-multiple: true
      - name: 核对全部平台的产物
        id: release
        run: node scripts/prepare-release.mjs
      - name: 上传并发布版本
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          tag="v$APP_VERSION"
          if gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            jq -e --arg sha "$GITHUB_SHA" '.isDraft == true and .targetCommitish == $sha' "$RUNNER_TEMP/release.json" > /dev/null || {
              echo '已有公开版本或草稿来源不同，停止覆盖'
              exit 1
            }
          else
            verify=()
            if [ "$GITHUB_REF_TYPE" = tag ]; then verify=(--verify-tag); fi
            gh release create "$tag" --draft "${verify[@]}" --target "$GITHUB_SHA" --title "Peek Desktop $tag" --notes-file release-artifacts/RELEASE_NOTES.md
          fi
          gh release upload "$tag" --clobber release-artifacts/*.dmg release-artifacts/*.exe release-artifacts/*.app.tar.gz release-artifacts/latest.json release-artifacts/manifest-*.json release-artifacts/SHA256SUMS.txt
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release edit "$tag" --draft=false --prerelease=false --latest
          fi
