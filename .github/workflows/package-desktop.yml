name: 桌面检查与打包
on:
  push:
    branches: [main]
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'assets/**', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'third-party/**', '.github/**']
  pull_request:
    paths: ['src/**', 'src-tauri/**', 'scripts/**', 'package.json', 'pnpm-lock.yaml', 'assets/**', 'LICENSE', 'THIRD_PARTY_NOTICES.md', 'third-party/**', '.github/**']
  workflow_dispatch:
    inputs:
      signing:
        description: 安装包签名模式
        type: choice
        options: [preview, signed]
        default: preview
      create_draft:
        description: 全部平台通过后创建 Release 草稿
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:check
      - run: pnpm release:test
      - run: pnpm check
      - run: pnpm test
      - run: pnpm format:check
      - run: pnpm build
  package:
    needs: checks
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      PACKAGE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.signing || 'preview' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.91.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: 准备 macOS 公证密钥
        if: runner.os == 'macOS' && env.PACKAGE_MODE == 'signed'
        shell: bash
        env:
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          if [ -z "$APPLE_API_PRIVATE_KEY" ]; then
            echo '未配置 APPLE_API_PRIVATE_KEY'
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/peek-notary-key.p8"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$key_file"
          echo "APPLE_API_KEY_PATH=$key_file" >> "$GITHUB_ENV"
      - name: 导入 Windows 分发证书
        if: runner.os == 'Windows' && env.PACKAGE_MODE == 'signed'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: ./.github/scripts/import-windows-certificate.ps1
      - name: 构建并验证安装包
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ env.PACKAGE_MODE == 'signed' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ env.PACKAGE_MODE == 'signed' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ env.PACKAGE_MODE == 'signed' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY: ${{ env.PACKAGE_MODE == 'signed' && secrets.APPLE_API_KEY || '' }}
          APPLE_API_ISSUER: ${{ env.PACKAGE_MODE == 'signed' && secrets.APPLE_API_ISSUER || '' }}
        run: node scripts/package-desktop.mjs "$PACKAGE_MODE" --target '${{ matrix.target }}'
      - name: macOS 挂载、复制和验签
        if: runner.os == 'macOS'
        run: python3 scripts/verify-macos-package.py release-artifacts/*.dmg
      - name: Windows 安装、关联和卸载验证
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/windows-installer-test.ps1
      - name: 清理签名材料
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/peek-notary-key.p8" "$RUNNER_TEMP/peek-signing.pfx"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: peek-${{ matrix.target }}-${{ env.PACKAGE_MODE }}
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 7
  draft:
    if: github.event_name == 'workflow_dispatch' && inputs.create_draft
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_MODE: ${{ inputs.signing }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: peek-*-${{ inputs.signing }}
          path: release-artifacts
          merge-multiple: true
      - name: 核对全部平台的产物
        id: release
        run: node scripts/prepare-release.mjs
      - name: 创建草稿
        env:
          APP_VERSION: ${{ steps.release.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$APP_VERSION"
          prerelease=()
          if [ "$PACKAGE_MODE" = preview ]; then
            tag="$tag-preview.$GITHUB_RUN_NUMBER"
            prerelease=(--prerelease)
          fi
          gh release create "$tag" --draft "${prerelease[@]}" --target "$GITHUB_SHA" --title "Peek Desktop $tag" --notes-file release-artifacts/RELEASE_NOTES.md release-artifacts/*.dmg release-artifacts/*.exe release-artifacts/manifest-*.json release-artifacts/SHA256SUMS.txt
